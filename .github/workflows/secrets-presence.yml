name: Secret presence check (booleans only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Presence booleans only, never values
        env:
          A: ${{ secrets.GH_LAB_USERNAME }}
          B: ${{ secrets.GH_LAB_PASSWORD }}
          C: ${{ secrets.GH_LAB_TOTP_SEED }}
          D: ${{ secrets.BLUE_TOOLS_SOURCE_KEY }}
        run: |
          pres() { [ -n "$1" ] && echo true || echo false; }
          b32=false; [ -n "$C" ] && printf '%s' "$C" | tr -d ' -' | grep -Eiq '^[A-Z2-7]{16,}=*$' && b32=true
          m="GH_LAB_USERNAME=$(pres "$A") GH_LAB_PASSWORD=$(pres "$B") GH_LAB_TOTP_SEED=$(pres "$C") TOTP_SEED_BASE32_SHAPE=$b32 BLUE_TOOLS_SOURCE_KEY=$(pres "$D")"
          echo "$m"; echo "::notice title=presence::$m"
